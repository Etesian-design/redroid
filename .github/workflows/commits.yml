# Conventional commits (commitlint.config.mjs), which go-semantic-release makes the releases from. Runs on GitHub's own runners.
# The same check runs locally as a git hook (.husky, after npm install).
name: Commits
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install commitlint
        run: npm ci --no-audit --no-fund   # the pinned versions in package-lock.json, next to the config
      - name: Lint pushed commits
        if: github.event_name == 'push'
        # a force push leaves "before" outside the new history: lint from where the two histories meet then
        run: |
          from=${{ github.event.before }}
          if ! git merge-base --is-ancestor "$from" ${{ github.sha }} 2>/dev/null; then
            from=$(git merge-base "$from" ${{ github.sha }} 2>/dev/null || git rev-parse ${{ github.sha }}~1)
          fi
          npx commitlint --from "$from" --to ${{ github.sha }} --verbose
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
