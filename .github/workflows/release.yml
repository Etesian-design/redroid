# SPDX-License-Identifier: Apache-2.0
# Releases, as in android_vendor_etesian: go-semantic-release reads the Conventional Commits since the last tag (feat = minor,
# fix = patch, breaking = major; below 1.0 a breaking change is a minor bump; docs, chore, ci, ... release nothing; the first
# release is v0.1.0). The image is built with the release keys and boot-tested in the throwaway VM on the DeskMini first (a dry
# run gives the version); only an image that booted makes the tag, the release and ghcr.io/etesian-design/redroid:<version>.
# Only master and manual runs reach the self-hosted runner, never a pull request.
name: Release
on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]   # documentation alone releases nothing
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redroid-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Etesian-design/redroid'
    runs-on: [self-hosted, deskmini]
    timeout-minutes: 720
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/etesian-design/redroid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0   # go-semantic-release needs the full tag history
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          repository: Etesian-design/android_vendor_etesian
          path: .etesian   # the Etesian experience, from its main branch
      - name: Install semantic-release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/semantic-release" https://github.com/go-semantic-release/semantic-release/releases/download/v2.31.0/semantic-release_v2.31.0_linux_amd64
          echo "b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3  $RUNNER_TEMP/semantic-release" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/semantic-release"
      - name: Next version
        id: next
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f   # v1
        with:
          dry: 'true'
          allow-initial-development-versions: 'true'
          bin: ${{ runner.temp }}/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, sign and boot-test
        if: steps.next.outputs.version != ''
        env:
          ETESIAN_KEYS_PASS: ${{ secrets.ETESIAN_KEYS_PASS }}
        run: printf %s "$ETESIAN_KEYS_PASS" | ci/release.sh "${{ steps.next.outputs.version }}" .etesian
      - name: Release
        id: semrel
        if: steps.next.outputs.version != ''
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f   # v1
        with:
          allow-initial-development-versions: 'true'
          bin: ${{ runner.temp }}/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker   # the login stays with this job
        run: |
          [ "$VERSION" = "${{ steps.next.outputs.version }}" ] || { echo "released $VERSION, built ${{ steps.next.outputs.version }}" >&2; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in "$VERSION" latest; do docker tag "etesian-redroid:$VERSION" "$IMAGE:$t" && docker push -q "$IMAGE:$t"; done
          docker logout ghcr.io
